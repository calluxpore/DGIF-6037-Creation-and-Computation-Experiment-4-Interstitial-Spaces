<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Defines the character encoding for the HTML document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures proper rendering and touch zooming on mobile devices -->
    <title>Visual Quote Display</title> <!-- Title of the HTML document -->
    <link rel="stylesheet" href="style.css"> <!-- Linking the external CSS file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script> <!-- Including the p5.js library -->
    <script src="sketch.js"></script> <!-- Including the JavaScript file with the main logic -->
</head>
<body>
    <!-- Control pill: dot size slider with colour theme buttons below it -->
    <div class="controls" role="group" aria-label="Display controls">
        <label class="visually-hidden" for="size-slider">Dot size</label>
        <input id="size-slider" type="range" min="10" max="60" value="30" step="1">
        <div class="themes" role="group" aria-label="Colour theme"></div> <!-- Filled from THEMES in sketch.js -->
    </div>
</body>
</html>
